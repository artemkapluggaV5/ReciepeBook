{% load icons %}
<div class="purchase-confirmed">
  <span class="purchase-confirmed-badge">Оплата подтверждена</span>
  <h3>Ваш сборник уже доступен</h3>
  <p>Повторно оплачивать не нужно. На странице скачивания вас ждёт основной сборник{% if product.bonus_pdf_name %} и подарок{% endif %}.</p>
  <a class="button purchase-button" href="{% url 'order-status' purchased_order.pk %}">Перейти к скачиванию {% icon 'arrow' %}</a>
  <p class="small">Открывайте страницу в том же браузере, где оформляли покупку.</p>
</div>
