# Replace cookbook.example.com, certificate paths, and the public-media directory.
# Bind the app port ONLY to loopback as in Compose. Nginx owns ports 80/443.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
server {
    listen 80;
    server_name cookbook.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name cookbook.example.com;
    ssl_certificate /etc/letsencrypt/live/cookbook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cookbook.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    # Avoid storing personal download tokens or order identifiers in access logs.
    access_log off;
    error_log /var/log/nginx/cookbook-error.log crit;
    location /private/ { return 404; }
    location /public-media/ {
        # Mount/copy ONLY owner-uploaded public images here. NEVER mount private_files.
        alias /srv/recipe-shop/public-media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        expires 1d;
    }
    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        include /etc/nginx/snippets/cookbook-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/cookbook-proxy.conf;
    }
}
